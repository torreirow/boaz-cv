baseURL: https://boaz.toorren.net
languageCode: nl
title: "Boaz van der Toorren"

# Use Hugo modules to add theme
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
      disable: false
  mounts:
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

# Manage languages
languages:
  nl:
    languageCode: nl
    languageName: Nederlands
    title: "Boaz van der Toorren"
    weight: 1
  # en:
  #   languageCode: en
  #   languageName: English
  #   title: "Boaz CV"
  #   weight: 1

# default language for the content
defaultContentLanguage: nl

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Enable global emoji support
enableEmoji: true

# Configure sitemap
sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

# Site parameters
params:
  # Background image of the landing page
  # background: /images/site/background.jpg

  # GitHub repo URL
  gitRepo: https://github.com/torreirow/boaz-cv
  gitBranch: main

  # Configure the number of section title visible in the top navbar
  topNavbar:
    maxVisibleSections: 5

  # Configure various features of this theme
  features:
    # Configure theme color settings
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system

    # Enable and configure portfolio
    portfolio:
      enable: true

    # Enable and configure blog posts
    blog:
      enable: false

    # Enable & configure "Notes" features
    notes:
      enable: false

    # Enable comment feature
    comment:
      enable: false

    # Enable Analytics
    analytics:
      enable: false

    # Enable "Support" Link
    support:
      enable: false

    # specify whether you want to show Table of Contents in reading page
    toc:
      enable: true

    # Show tags under the post title
    tags:
      enable: true
      on_card: true

    # Specify whether to show flag in the language selector
    flags:
      enable: true

    # Enable copy code button
    copyCodeButton:
      enable: true

    # Enable reading time support in post cards and in post pages
    readingTime:
      enable: true

  # Provide footer configuration
  footer:
    enable: true
    navigation:
      enable: true
      customMenus: false
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
