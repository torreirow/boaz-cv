achievements:
  - title: Korfbal bij Dindoa
    image: images/sections/achievements/korfbal-koploper.png
    summary: |
      Ik speel korfbal bij Dindoa in het J3 team. Het is echt een toffe sport - je moet echt samenwerken om te winnen.
      Naast het sporten is het gewoon heel gezellig met het team. We steunen elkaar altijd en hebben veel plezier samen.

  - title: Profielkeuze Natuur & Gezondheid
    image: images/sections/achievements/profiel-ng.png
    summary: |
      In HAVO 3 heb ik gekozen voor het profiel Natuur & Gezondheid (N&G) met BSM.
      Ik vond dit een goede keuze omdat ik wetenschap en sterrenkunde interessant vind.
      Met vakken als biologie, scheikunde en natuurkunde snap je meer van hoe de wereld werkt.
      En het past ook goed bij wat ik later misschien wil worden.

  - title: Bijbaantje
    image: images/sections/achievements/werk.png
    summary: |
      Ik heb mijn eerste bijbaan bij Snackbar Pinokkio. Als afwasser en bezorger doe ik gewoon mijn best.
      Je leert er wel wat van en je hebt je eigen geld - dat is toch wel fijn.
