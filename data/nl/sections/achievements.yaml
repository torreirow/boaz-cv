achievements:
  - title: Korfbal bij Dindoa
    image: images/sections/achievements/korfbal-koploper.png
    summary: |
      Ik speel korfbal bij Dindoa in het J3 team, een gemengd team met jongens en meiden.
      Korfbal is een geweldige sport waarbij je echt moet samenwerken om te winnen. Het is niet alleen lekker sporten,
      maar ook heel gezellig met het team! Door trainingen en wedstrijden leer ik steeds beter te spelen,
      maar vooral ook om een goede teamspeler te zijn. We hebben veel plezier samen en steunen elkaar altijd.

  - title: Profielkeuze Natuur & Gezondheid
    image: images/sections/achievements/profiel-ng.png
    summary: |
      In HAVO 3 heb ik bewust gekozen voor het profiel Natuur & Gezondheid (N&G) in combinatie met BSM. 
      Dit profiel past perfect bij mijn interesse in wetenschap, gezondheid en sterrenkunde. 
      Met vakken als biologie, scheikunde en natuurkunde leer ik hoe de wereld en het heelal werken. 
      Deze keuze brengt me dichter bij mijn toekomstdroom om sportleerkracht of sterrenkundige te worden!

  - title: Bijbaantje
    image: images/sections/achievements/werk.png
    summary: |
      Mijn eerste bijbaan bij Snackbar Pinokkio is een belangrijke stap! 
      Hier leer ik verantwoordelijkheid nemen, goed met klanten omgaan en deel uitmaken van een team. 
      Als afwasser en bezorger doe ik mijn werk nauwkeurig en zorg ik dat alles netjes en op tijd gebeurt. 
      Het voelt goed om mijn eigen geld te verdienen en praktische ervaring op te doen!
