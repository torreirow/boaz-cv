summary: |
  Hoi! Ik ben Boaz, 14 jaar en ik woon in Ermelo. Ik zit momenteel in de derde klas van de HAVO op het Christelijk College Groevenbeek, waar ik het profiel Natuur & Gezondheid heb gekozen. Dit profiel past goed bij mijn interesse in wetenschap en gezondheid.

  Ik volg het onderwijs via Groevenbeek NEXT - een onderwijsvorm waarbij ik veel vrijheid krijg om te leren op mijn eigen manier. We werken project gericht en doen veel onderzoeken waar we dan weer een presentatie over moeten geven. Ik werk aan de kernvakken en kan zelf onderwerpen kiezen om te onderzoeken. Dit past perfect bij mijn nieuwsgierige en onderzoekende karakter!
  
  Naast school ben ik actief met sport. Ik speel korfbal bij Dindoa Ermelo in het J3 team, een gemengd team met jongens en meiden. Korfbal is een geweldige sport waarbij je echt moet samenwerken, en het is ook heel gezellig! Daarnaast gooi ik ook wel eens een balletje basketbal, dan kan ik even wat energie kwijt.
  
  Om wat bij te verdienen werk ik bij Snackbar Pinokkio als afwasser en bezorger. Het is mijn eerste baantje.
  
  In mijn vrije tijd vind ik het leuk om te gamen en af en toe experimenteer ik met de Arduino van mijn vader.
  
  Later zou ik graag sportleerkracht willen worden, want ik vind het geweldig om te sporten en anderen daarbij te helpen. Of misschien word ik wel sterrenkundige, dat vind ik ook erg interessant.

