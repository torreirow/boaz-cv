summary: |
  Hoi! Ik ben Boaz, 15 jaar en ik woon in Ermelo. Ik zit nu in HAVO 4 op het Christelijk College Groevenbeek. Ik doe het profiel Natuur & Gezondheid, wat best goed bij me past omdat ik wetenschap interessant vind.

  Ik doe mee aan Groevenbeek NEXT - een manier van leren waarbij je veel vrijheid hebt. We werken aan projecten en doen onderzoeken, en dan moet je er een presentatie over geven. Ik vind het wel fijn dat je zelf onderwerpen mag kiezen, want dan kun je echt iets doen wat je interesseert.

  Ik speel korfbal bij Dindoa Ermelo in het J3 team. Korfbal is echt een toffe sport, je moet goed samenwerken en het is ook gewoon gezellig met het team. Af en toe basketbal ik ook, gewoon voor de lol.

  Ik werk bij Snackbar Pinokkio als afwasser en bezorger. Het is mijn eerste bijbaan en je leert er wel wat van.

  In mijn vrije tijd game ik veel en soms doe ik wat met de Arduino van m'n vader. En ik help ook soms mee met de techniek bij de kerk, dus geluid en media.

  Later wil ik misschien sportleerkracht worden, want ik vind sporten echt geweldig. Of misschien toch sterrenkundige? Dat vind ik ook echt gaaf.

