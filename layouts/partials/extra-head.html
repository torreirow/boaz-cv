<!-- Prevent indexing by search engines and AI scrapers -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="slurp" content="noindex, nofollow, noarchive">
<meta name="duckduckbot" content="noindex, nofollow">

<!-- Email obfuscation script (anti-scraping) -->
<script src="{{ "js/email-obfuscate.js" | relURL }}"></script>

<!-- Custom CSS for menu font size and other customizations -->
<style>
/* Increase navbar menu font size by 1.5pt */
.navbar-nav .nav-link {
    font-size: calc(1rem + 1.5pt) !important;
}

/* Also increase navbar brand font size for consistency */
.navbar-brand {
    font-size: calc(1.25rem + 1.5pt) !important;
}

/* Increase dropdown menu items if they exist */
.dropdown-menu .dropdown-item {
    font-size: calc(1rem + 1.5pt) !important;
}

/* Make project cards equal height - dynamic based on tallest card */
#project-card-holder-projects .filtr-item > .card > .card {
    display: flex !important;
    flex-direction: column !important;
}

#project-card-holder-projects .card-header {
    flex-shrink: 0 !important;
}

#project-card-holder-projects .card-body {
    display: flex !important;
    flex-direction: column !important;
    flex: 1 !important;
}

#project-card-holder-projects .project-card-footer {
    margin-top: auto !important;
    flex-shrink: 0 !important;
}
</style>

<!-- Equalize project card heights based on tallest card -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    function equalizeCardHeights() {
        const cards = document.querySelectorAll('#project-card-holder-projects .filtr-item > .card > .card');
        if (cards.length === 0) return;

        // Reset heights first
        cards.forEach(card => card.style.height = 'auto');

        // Find the tallest card
        let maxHeight = 0;
        cards.forEach(card => {
            const height = card.offsetHeight;
            if (height > maxHeight) maxHeight = height;
        });

        // Apply max height to all cards
        cards.forEach(card => {
            card.style.height = maxHeight + 'px';
        });
    }

    // Run on load
    equalizeCardHeights();

    // Re-run after filterizr animations (if they exist)
    setTimeout(equalizeCardHeights, 100);
    setTimeout(equalizeCardHeights, 500);

    // Re-run on window resize
    window.addEventListener('resize', equalizeCardHeights);

    // Re-run when filter buttons are clicked
    const filterButtons = document.querySelectorAll('.project-filtr-control');
    filterButtons.forEach(button => {
        button.addEventListener('click', function() {
            setTimeout(equalizeCardHeights, 600);
        });
    });
});
</script>

<style>
/* Verminder de blur op de landingsachtergrond (theme-default is 3px) */
.home .background {
    filter: blur(1px) !important;
}
</style>
